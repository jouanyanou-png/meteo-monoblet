name: Actualiser la meteo

# Le minuteur "schedule" de GitHub est peu fiable (souvent saute).
# Donc chaque lancement tourne ~5h : il lit les sites toutes les heures (a l'heure pile + 2 min),
# puis se relance lui-meme a la fin. Le "schedule" reste en secours.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: meteo
  cancel-in-progress: false

jobs:
  actualiser:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer le navigateur invisible
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Lire les 4 sites toutes les heures (5 fois)
        run: |
          git config user.name "meteo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main   # repartir de la derniere version
            timeout 600 python recuperer_meteo.py || echo "lecture ratee, on continue"
            timeout 180 python recuperer_bourse.py || echo "bourse ratee, on continue"
            git add donnees.js bourse.js
            if ! git diff --cached --quiet; then
              git commit -m "Meteo du $(date '+%d/%m %Hh%M')"
              git push || echo "envoi rate"
            fi
            # attendre la prochaine heure pile + 2 min (8h02, 9h02...) : la veille Trump tombe a 8h02
            if [ $i -lt 5 ]; then sleep $(( 3600 - 10#$(date +%M) * 60 - 10#$(date +%S) + 120 )); fi
          done
      - name: Se relancer pour la suite
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run meteo.yml --repo ${{ github.repository }} --ref main
