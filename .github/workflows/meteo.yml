name: Actualiser la meteo

on:
  schedule:
    - cron: "7 * * * *"   # toutes les heures (heure UTC), a la 7e minute
  workflow_dispatch:       # bouton "Run workflow" pour lancer a la main

permissions:
  contents: write

concurrency:
  group: meteo
  cancel-in-progress: false

jobs:
  actualiser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer le navigateur invisible
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Lire les 4 sites
        run: python recuperer_meteo.py
      - name: Enregistrer les nouvelles donnees
        run: |
          git config user.name "meteo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees.js
          git diff --cached --quiet || (git commit -m "Meteo du $(date '+%d/%m %Hh%M')" && git push)
